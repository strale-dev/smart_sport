<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Scorence password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0A0B0F;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#0A0B0F;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#12141C;border:1px solid #1F2330;border-radius:12px;padding:32px 28px;">
            <tr>
              <td style="color:#00E5A0;font-size:24px;font-weight:700;padding-bottom:8px;">Scorence</td>
            </tr>
            <tr>
              <td style="color:#F5F7FA;font-size:20px;font-weight:600;padding-bottom:12px;">Reset your password</td>
            </tr>
            <tr>
              <td style="color:#8B94A8;font-size:15px;line-height:24px;padding-bottom:24px;">
                We received a request to reset the password for your account. Use the button below to choose a new password.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}" style="background-color:#00E5A0;border-radius:8px;color:#0A0B0F;display:inline-block;font-size:15px;font-weight:600;padding:12px 24px;text-decoration:none;">Reset password</a>
              </td>
            </tr>
            <tr>
              <td style="color:#4A5266;font-size:12px;line-height:18px;">
                If you did not request a password reset, you can ignore this message.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
