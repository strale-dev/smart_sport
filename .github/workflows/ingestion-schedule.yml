# Sub-daily ingestion while Vercel is on Hobby (vercel.json stays daily-only).
# Repo secret: CRON_SECRET (same as Vercel Production).
# Optional repo variable: PRODUCTION_SITE_URL (defaults to https://scorence.app).
#
# Do not put `matrix` in jobs.<id>.if — GitHub evaluates that before matrix
# expansion and rejects the workflow (Unrecognized named-value: 'matrix').
name: Ingestion schedule

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which Production cron route to trigger
        type: choice
        required: true
        default: lineups
        options:
          - lineups
          - standings
          - live
          - both

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const rows = [
            { id: "lineups", path: "/api/cron/sync-lineups", schedule: "*/15 * * * *" },
            { id: "sync-live-center", path: "/api/cron/sync-live-center", schedule: "*/15 * * * *" },
            { id: "sync-fixtures-today", path: "/api/cron/sync-fixtures-today", schedule: "*/15 * * * *" },
            { id: "reap-stale-locks", path: "/api/cron/reap-stale-locks", schedule: "*/5 * * * *" },
            { id: "reconcile-ai-usage", path: "/api/cron/reconcile-ai-usage", schedule: "*/5 * * * *" },
            { id: "standings", path: "/api/cron/sync-standings", schedule: "0 */6 * * *" },
          ];
          const liveIds = new Set([
            "sync-live-center",
            "sync-fixtures-today",
            "reap-stale-locks",
          ]);

          const eventName = process.env.EVENT_NAME;
          const schedule = process.env.EVENT_SCHEDULE;
          const target = process.env.TARGET;

          const picked = rows.filter((row) => {
            if (eventName === "schedule") {
              return row.schedule === schedule;
            }
            if (target === "both") return true;
            if (target === row.id) return true;
            if (target === "live") return liveIds.has(row.id);
            return false;
          });

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `include=${JSON.stringify(picked)}\n`,
          );
          EOF

  trigger:
    needs: select
    if: needs.select.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Avoid parallel /fixtures calls + concurrent upserts (quota, locks, 58s client timeout).
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger ${{ matrix.id }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: node scripts/trigger-production-cron.mjs "${{ matrix.path }}"
