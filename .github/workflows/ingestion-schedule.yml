# Manual-only entry point. Scheduled runs use split workflows (one cron per file):
# - ingestion-schedule-5min.yml
# - ingestion-schedule-15min.yml
# - ingestion-schedule-6h.yml
# - ingestion-schedule-daily.yml
# - ingestion-cadence-watchdog.yml (*/15 recovery at :02/:17/:32/:47)
name: Ingestion schedule

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Production cron route to trigger
        type: choice
        required: true
        default: lineups
        options:
          - lineups
          - standings
          - live
          - both

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          JOB_SET: ingestion
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
        run: node scripts/pick-ingestion-gha-jobs.mjs

  trigger:
    needs: select
    if: needs.select.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger ${{ matrix.id }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: node scripts/trigger-production-cron.mjs "${{ matrix.path }}"
