# Sub-daily AI warm while Vercel is on Hobby (see ingestion-schedule.yml for fixture ingest).
name: Ingestion AI warm

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which warm cron route to trigger
        type: choice
        required: true
        default: warm-ai-prematch
        options:
          - warm-ai-prematch
          - warm-ai-prematch-daily
          - both

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          JOB_SET: warm
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
        run: node scripts/pick-ingestion-gha-jobs.mjs

  trigger:
    needs: select
    if: needs.select.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger ${{ matrix.id }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: node scripts/trigger-production-cron.mjs "${{ matrix.path }}"
