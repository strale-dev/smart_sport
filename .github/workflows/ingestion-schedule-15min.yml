# One cron expression per workflow — GitHub Actions delays multi-cron workflows by hours.
name: Ingestion schedule (15 min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          JOB_SET: ingestion
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/pick-ingestion-gha-jobs.mjs

  trigger:
    needs: select
    if: needs.select.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger ${{ matrix.id }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: node scripts/trigger-production-cron.mjs "${{ matrix.path }}"
